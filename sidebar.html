<script>
// Active page highlighting
document.addEventListener('DOMContentLoaded', function() {
    // Get current page name from URL
    const currentPage = window.location.pathname.split('/').pop().toLowerCase();
    const navLinks = document.querySelectorAll('.nav-link');
    
    // Remove active class from all links first
    navLinks.forEach(link => {
        link.classList.remove('active');
        link.style.backgroundColor = '';
        link.style.color = '';
    });
    
    // Add active class to current page
    navLinks.forEach(link => {
        const href = link.getAttribute('href').toLowerCase();
        if (currentPage.includes('dashboard') && href.includes('dashboard')) {
            link.classList.add('active');
        } else if (currentPage.includes('unitsinformation') && href.includes('unitsinformation')) {
            link.classList.add('active');
        } else if (currentPage.includes('tenantslist') && href.includes('tenantslist')) {
            link.classList.add('active');
        } else if (currentPage.includes('paymentmanagement') && href.includes('paymentmanagement')) {
            link.classList.add('active');
        } else if (currentPage.includes('accesspointlogs') && href.includes('accesspointlogs')) {
            link.classList.add('active');
        } else if (currentPage.includes('cardregistration') && href.includes('cardregistration')) {
            link.classList.add('active');
        } else if (currentPage.includes('pendingrequest') && href.includes('pendingrequest')) {
            link.classList.add('active');
        } else if (currentPage.includes('contractmanagement') && href.includes('contractmanagement')) {
            link.classList.add('active');
        }
    }); 
    
    // Apply active styling
    const activeLink = document.querySelector('.nav-link.active');
    if (activeLink) {
        activeLink.style.backgroundColor = '#FFFF';
        activeLink.style.color = '#004AAD';
    }
}); 
</script>
